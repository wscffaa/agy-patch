# Adapted from deepseek-ai/deepseek-harness (MIT): lefthook.yml
# Install: `npx lefthook install`. Keep these local checkpoints fast; CI owns the full gate matrix.

pre-commit:
  jobs:
    - name: agent note format (staged)
      glob: '.agents/notes/**/*.md'
      exclude:
        - '.agents/notes/archived/**'
      run: npm --prefix scripts/tianshu run gate -- agent-note-format --repo "$PWD" --staged

    - name: archived agent notes
      glob: '.agents/notes/archived/**'
      run: npm --prefix scripts/tianshu run gate -- archived-agent-notes --repo "$PWD"

    - name: translation pairing (staged records)
      glob: '*.md'
      run: npm --prefix scripts/tianshu run gate -- translation-pairing --repo "$PWD" --staged

    - name: whitespace (staged)
      run: git diff --cached --check

# pre-push: project-specific incremental checks (for example, typecheck or affected tests).
# Keep them fast; the CI gate matrix owns exhaustive coverage.
