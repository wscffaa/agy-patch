# Adapted from deepseek-ai/deepseek-harness (MIT): .github/workflows/ci.yml (Tianshu gates job)
name: Tianshu gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Tianshu gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install gates
        run: npm --prefix scripts/tianshu ci

      - name: Run repository gates
        run: npm --prefix scripts/tianshu run gates -- --repo "$PWD"
