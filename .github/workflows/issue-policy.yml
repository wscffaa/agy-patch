# Adapted from deepseek-ai/deepseek-harness (MIT): .github/workflows/issue-policy.yml
name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    # Draft pull requests are exempt until they are marked ready for review.
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      # Run the policy from the default branch so a pull request cannot alter its own check.
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install gates
        run: npm --prefix scripts/tianshu ci

      - name: Validate pull request
        env:
          TIANSHU_PR_BODY: ${{ github.event.pull_request.body }}
          TIANSHU_PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # Reads the labels of every referenced Issue (permissions: issues: read).
          GITHUB_TOKEN: ${{ github.token }}
        run: npm --prefix scripts/tianshu run gate -- issue-policy --repo "$PWD"
